<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Place Them — Monitor de jugadores en vivo</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e8eb;
    padding: 24px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 600;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #9aa0a6;
  }
  .dot-small {
    width: 8px; height: 8px; border-radius: 50%;
    background: #34a853;
  }
  .stats {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 140px;
  }
  .stat-card .value {
    font-size: 28px;
    font-weight: 700;
  }
  .stat-card .label {
    font-size: 12px;
    color: #9aa0a6;
    margin-top: 4px;
  }
  .stat-card.online .value { color: #34a853; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #1a1d24;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #2a2e37;
  }
  th, td {
    text-align: left;
    padding: 12px 16px;
    font-size: 14px;
  }
  th {
    background: #20242d;
    color: #9aa0a6;
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tr:not(:last-child) td {
    border-bottom: 1px solid #2a2e37;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge.online { background: rgba(52,168,83,0.15); color: #34a853; }
  .badge.offline { background: rgba(154,160,166,0.15); color: #9aa0a6; }
  .uid {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: #9aa0a6;
  }
  .screen {
    font-weight: 500;
  }
  .empty {
    text-align: center;
    padding: 48px 16px;
    color: #9aa0a6;
    font-size: 14px;
  }
  .error {
    background: rgba(217,48,37,0.12);
    border: 1px solid rgba(217,48,37,0.4);
    color: #f28b82;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Place Them — Jugadores en vivo</h1>
  <div class="status-pill"><span class="dot-small"></span> Conectado en tiempo real</div>
</div>

<div id="errorBox" class="error"></div>

<div class="stats">
  <div class="stat-card online">
    <div class="value" id="onlineCount">–</div>
    <div class="label">Jugando ahora</div>
  </div>
  <div class="stat-card">
    <div class="value" id="totalCount">–</div>
    <div class="label">Registrados en presencia</div>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>Estado</th>
      <th>Usuario (UID)</th>
      <th>Pantalla actual</th>
      <th>Última actividad</th>
    </tr>
  </thead>
  <tbody id="tableBody">
    <tr><td colspan="4" class="empty">Cargando datos de presencia…</td></tr>
  </tbody>
</table>

<script>
  const firebaseConfig = {
    apiKey: 'AIzaSyANvGrOQGIsrMTDhhFXaap83wpdZUWq6Ng',
    authDomain: 'place-them.firebaseapp.com',
    databaseURL: 'https://place-them-default-rtdb.europe-west1.firebasedatabase.app',
    projectId: 'place-them',
    storageBucket: 'place-them.firebasestorage.app',
    messagingSenderId: '119303022429',
    appId: '1:119303022429:web:aad5c379d94ceaf49faab4',
  };

  const errorBox = document.getElementById('errorBox');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  try {
    firebase.initializeApp(firebaseConfig);
  } catch (e) {
    showError('No se pudo inicializar Firebase: ' + e.message);
  }

  const db = firebase.database();
  const presenceRef = db.ref('presence');

  function timeAgo(ts) {
    if (!ts) return '—';
    const diff = Math.max(0, Date.now() - ts);
    const s = Math.floor(diff / 1000);
    if (s < 60) return 'hace ' + s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return 'hace ' + m + ' min';
    const h = Math.floor(m / 60);
    if (h < 24) return 'hace ' + h + 'h';
    const d = Math.floor(h / 24);
    return 'hace ' + d + 'd';
  }

  function render(data) {
    const tbody = document.getElementById('tableBody');
    const entries = Object.entries(data || {});

    document.getElementById('totalCount').textContent = entries.length;
    const onlineCount = entries.filter(([, v]) => v && v.online).length;
    document.getElementById('onlineCount').textContent = onlineCount;

    if (entries.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">Nadie ha aparecido en presence/ todavía. En cuanto un jugador abra la app con el sistema de presencia activo, saldrá aquí.</td></tr>';
      return;
    }

    entries.sort((a, b) => {
      const aOn = a[1] && a[1].online ? 1 : 0;
      const bOn = b[1] && b[1].online ? 1 : 0;
      if (aOn !== bOn) return bOn - aOn;
      return (b[1]?.lastSeen || 0) - (a[1]?.lastSeen || 0);
    });

    tbody.innerHTML = entries.map(([uid, v]) => {
      const online = v && v.online;
      const screen = (v && v.screen) || '—';
      const lastSeen = v && v.lastSeen;
      return `
        <tr>
          <td><span class="badge ${online ? 'online' : 'offline'}">${online ? '● En línea' : '○ Desconectado'}</span></td>
          <td class="uid">${uid}</td>
          <td class="screen">${screen}</td>
          <td>${timeAgo(lastSeen)}</td>
        </tr>
      `;
    }).join('');
  }

  presenceRef.on('value', (snapshot) => {
    render(snapshot.val());
  }, (err) => {
    showError('Error leyendo la base de datos: ' + err.message + '. Revisa que las reglas de Realtime Database permiten ".read": true en presence/.');
  });

  // Refresca los "hace X min" cada 15s aunque no cambien los datos
  setInterval(() => {
    presenceRef.once('value').then(snap => render(snap.val()));
  }, 15000);
</script>

</body>
</html>
